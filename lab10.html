<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10</title>
</head>

<body>
    <script>
        let bill;
        let isValid = false;
        let message = "Please enter the total restaurant bill amount:";

        do {
            let input = prompt(message);

            if (input == "" || input == 0 || input == null) {
                message = "Please enter a bill amount greater than zero.";
            } else if (input < 0) {
                message = "Negative amounts are not allowed. Please enter a valid bill amount.";
            } else if (isNaN(input)) {
                message = "Invalid input. Please enter a numeric bill amount.";
            } else {
                bill = Number(input);
                isValid = true;
            }
        } while (!isValid);

        let tip = bill * 0.10;
        let result = "For a bill of $" + Number(bill).toFixed(2) + ", the tip should be $" + Number(tip).toFixed(2) + ".";

        console.log(result);
        document.write(result);
    </script>
</body>

</html>
