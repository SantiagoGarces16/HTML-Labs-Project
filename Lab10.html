<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab10</title>
    <style>
        #box{
            background-color: blue;
            color:white;
            font-size: 1.2cm;
            width: 425px;
            padding: 3px;
        }
        #box2{
            height: 75vh;
        }
    </style>
</head>
<body>
    <div id="box"> Click Me! 😊</div>
    <div id="box2"></div>
<script>
    const box = document.getElementById('box');
    function click(event){
            box.style.backgroundColor = 'red';
            box.style.color = 'white';
            box.textContent = "Ouch! 🤕"
        }
    function hover(event){
        box.style.backgroundColor = "yellow";
        box.textContent = "Do not click! 😠"
    }
    function out(event){
        box.style.backgroundColor = "green";
        box.textContent = "Phew! 😌"
    }
    function double(event){
        box.style.backgroundColor = "pink";
        box.textContent = "Double trouble! 🤩"
    }
    function move(event){
        box.style.backgroundColor = "lightblue";
        box.textContent = "I see you! 👀"
    }
    box.addEventListener('click', click);
    box.addEventListener('mouseover', hover);
    box.addEventListener('mouseout', out);
    box.addEventListener('dblclick', double);
    box2.addEventListener('mousemove', move);
</script>
    
</body>
</html>
