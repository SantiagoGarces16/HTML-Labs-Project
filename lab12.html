<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 12</title>
</head>
<body>
    <h1>Greeting Calculator</h1>

    <div>
        <label for="name">Enter your name: </label>
        <input type="text" id="name">
        <button type="button" onclick="greet()">Greet</button>
        <h2 id="greeting"></h2>
    </div>

    <div>
        <h3>Calculator</h3>
        <p>
            <label for="num1">First Number: </label>
            <input type="number" id="num1" step="any">
        </p>
        <p>
            <label for="num2">Second Number: </label>
            <input type="number" id="num2" step="any">
        </p>
        <p>
            <input type="radio" id="add" name="operation" value="add">
            <label for="add">Addition</label>
            <input type="radio" id="subtract" name="operation" value="subtract">
            <label for="subtract">Subtraction</label>
            <input type="radio" id="multiply" name="operation" value="multiply">
            <label for="multiply">Multiplication</label>
            <input type="radio" id="divide" name="operation" value="divide">
            <label for="divide">Division</label>
        </p>
        <button type="button" onclick="calculate()">Calculate</button>
        <button type="button" onclick="clearScreen()">Clear</button>
        <h3 id="result"></h3>
    </div>

    <script>
        function greet() {
            let name = document.getElementById("name").value;
            if (name != "") {
                document.getElementById("greeting").textContent = "Hello, " + name + "!";
            } else {
                document.getElementById("greeting").textContent = "Hello!";
            }
        }

        function calculate() {
            let name = document.getElementById("name").value;
            if (name != "" && document.getElementById("greeting").textContent == "") {
                document.getElementById("greeting").textContent = "Hello, " + name + "!";
            }

            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;

            if (num1 == "" || num2 == "") {
                document.getElementById("result").textContent = "Please enter both numbers.";
                return;
            }

            let n1 = Number(num1);
            let n2 = Number(num2);

            let operation = "";
            let radios = document.getElementsByName("operation");
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    operation = radios[i].value;
                }
            }

            if (operation == "") {
                document.getElementById("result").textContent = "Please select an operation.";
                return;
            }

            let result;
            if (operation == "add") {
                result = n1 + n2;
            } else if (operation == "subtract") {
                result = n1 - n2;
            } else if (operation == "multiply") {
                result = n1 * n2;
            } else if (operation == "divide") {
                if (n2 == 0) {
                    document.getElementById("result").textContent = "Cannot divide by zero.";
                    return;
                }
                result = n1 / n2;
            }

            document.getElementById("result").textContent = "Result: " + result;
        }

        function clearScreen() {
            document.getElementById("name").value = "";
            document.getElementById("greeting").textContent = "";
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            let radios = document.getElementsByName("operation");
            for (let i = 0; i < radios.length; i++) {
                radios[i].checked = false;
            }
            document.getElementById("result").textContent = "";
        }
    </script>
</body>
</html>
