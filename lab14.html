<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 14</title>
    <style>
        div {
            border: 1px solid black;
            width: fit-content;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <script>
        const site = 'https://randomuser.me/api/';
        let card = document.createElement('div');

        let img = document.createElement('img');
        let Name = document.createElement('h3');
        let Email = document.createElement('p');
        let phone = document.createElement('p');

        let bttn = document.createElement('button');
        bttn.type = 'button';
        bttn.textContent = 'Generate Profile';

        let form = document.createElement('form');
        form.action = '#';

        form.appendChild(bttn);
        card.append(img, Name, Email, phone);
        document.body.append(form, card);

        const getImg = async () => {
            try {
                let result = await fetch(site);
                result = await result.json();
                Name.textContent = result.results[0].name.first;
                Email.textContent = result.results[0].email;
                phone.textContent = result.results[0].phone;
                img.src = result.results[0].picture.large;
                img.alt = 'Picture';
            } catch (reason) {
                console.log(reason);
            }
        }
        bttn.addEventListener('click', getImg);

    </script>
</body>

</html>
